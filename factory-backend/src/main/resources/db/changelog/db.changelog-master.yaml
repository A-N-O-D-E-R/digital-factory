databaseChangeLog:
  - changeSet:
      id: 001-workflow-engine-storage
      author: digital-factory
      comment: Durable storage of the workflow engine (workflow-spring-boot-starter, JDBC storage)
      changes:
        - sqlFile:
            path: com/anode/workflow/spring/storage/schema-postgresql.sql
            relativeToChangelogFile: false
  - changeSet:
      id: 002-workflow-versions
      author: digital-factory
      changes:
        - createTable:
            tableName: workflow_versions
            columns:
              - column: { name: name, type: varchar(63), constraints: { nullable: false } }
              - column: { name: version, type: int, constraints: { nullable: false } }
              - column: { name: definition, type: jsonb, constraints: { nullable: false } }
              - column: { name: note, type: varchar(200), constraints: { nullable: false } }
              - column: { name: created_by, type: varchar(255), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
        - addPrimaryKey:
            tableName: workflow_versions
            columnNames: name, version
  - changeSet:
      id: 003-work-orders-runs-approvals-workers
      author: digital-factory
      changes:
        - createTable:
            tableName: work_orders
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true } }
              - column: { name: repository, type: varchar(255), constraints: { nullable: false } }
              - column: { name: title, type: varchar(300), constraints: { nullable: false } }
              - column: { name: description, type: text, constraints: { nullable: false } }
              - column: { name: workflow_name, type: varchar(63), constraints: { nullable: false } }
              - column: { name: workflow_version, type: int, constraints: { nullable: false } }
              - column: { name: status, type: varchar(32), constraints: { nullable: false } }
              - column: { name: current_step, type: varchar(63) }
              - column: { name: current_visit, type: int, constraints: { nullable: false } }
              - column: { name: outcome_reason, type: text }
              - column: { name: facts, type: jsonb, constraints: { nullable: false } }
              - column: { name: visits, type: jsonb, constraints: { nullable: false } }
              - column: { name: transition_counts, type: jsonb, constraints: { nullable: false } }
              - column: { name: created_by, type: varchar(255), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: work_orders
            baseColumnNames: workflow_name, workflow_version
            referencedTableName: workflow_versions
            referencedColumnNames: name, version
            constraintName: fk_work_orders_workflow
        - createTable:
            tableName: runs
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true } }
              - column: { name: work_order_id, type: uuid, constraints: { nullable: false, foreignKeyName: fk_runs_work_order, references: work_orders(id) } }
              - column: { name: step_id, type: varchar(63), constraints: { nullable: false } }
              - column: { name: visit, type: int, constraints: { nullable: false } }
              - column: { name: kind, type: varchar(16), constraints: { nullable: false } }
              - column: { name: task, type: varchar(63), constraints: { nullable: false } }
              - column: { name: status, type: varchar(16), constraints: { nullable: false } }
              - column: { name: attempt, type: int, constraints: { nullable: false } }
              - column: { name: input, type: jsonb, constraints: { nullable: false } }
              - column: { name: output, type: jsonb }
              - column: { name: error, type: text }
              - column: { name: worker_id, type: uuid }
              - column: { name: lease_until, type: timestamptz }
              - column: { name: cost_usd, type: "numeric(12,4)" }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: started_at, type: timestamptz }
              - column: { name: finished_at, type: timestamptz }
        - createIndex:
            tableName: runs
            indexName: ix_runs_queued
            columns: [ { column: { name: status } }, { column: { name: created_at } } ]
        - createIndex:
            tableName: runs
            indexName: ix_runs_work_order
            columns: [ { column: { name: work_order_id } }, { column: { name: step_id } }, { column: { name: visit } } ]
        - createTable:
            tableName: approvals
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true } }
              - column: { name: work_order_id, type: uuid, constraints: { nullable: false, foreignKeyName: fk_approvals_work_order, references: work_orders(id) } }
              - column: { name: step_id, type: varchar(63), constraints: { nullable: false } }
              - column: { name: visit, type: int, constraints: { nullable: false } }
              - column: { name: gate, type: varchar(32), constraints: { nullable: false } }
              - column: { name: decision, type: varchar(16), constraints: { nullable: false } }
              - column: { name: decided_by, type: varchar(255) }
              - column: { name: comment, type: text }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: decided_at, type: timestamptz }
        - addUniqueConstraint:
            tableName: approvals
            columnNames: work_order_id, step_id, visit
            constraintName: uq_approvals_visit
        - createTable:
            tableName: workers
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true } }
              - column: { name: name, type: varchar(63), constraints: { nullable: false, unique: true } }
              - column: { name: active, type: boolean, constraints: { nullable: false } }
              - column: { name: created_by, type: varchar(255), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
  - changeSet:
      id: 004-repositories
      author: digital-factory
      changes:
        - createTable:
            tableName: repositories
            columns:
              - column: { name: key, type: varchar(255), constraints: { primaryKey: true } }
              - column: { name: forge, type: varchar(16), constraints: { nullable: false } }
              - column: { name: path, type: varchar(255), constraints: { nullable: false } }
              - column: { name: default_branch, type: varchar(255), constraints: { nullable: false } }
              - column: { name: test_command, type: text, constraints: { nullable: false } }
              - column: { name: test_reports, type: varchar(255), constraints: { nullable: false } }
              - column: { name: sandbox_image, type: varchar(255), constraints: { nullable: false } }
              - column: { name: active, type: boolean, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: work_orders
            baseColumnNames: repository
            referencedTableName: repositories
            referencedColumnNames: key
            constraintName: fk_work_orders_repository
  - changeSet:
      id: 005-autonomy-policies
      author: digital-factory
      changes:
        - createTable:
            tableName: autonomy_policies
            columns:
              - column: { name: work_order_type, type: varchar(32), constraints: { primaryKey: true } }
              - column: { name: level, type: varchar(16), constraints: { nullable: false } }
              - column: { name: min_success_rate, type: "numeric(5,4)", constraints: { nullable: false } }
              - column: { name: success_rate, type: "numeric(5,4)" }
              - column: { name: updated_by, type: varchar(255), constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
  - changeSet:
      id: 006-forge-events
      author: digital-factory
      changes:
        - createTable:
            tableName: forge_events
            columns:
              - column: { name: id, type: varchar(255), constraints: { primaryKey: true } }
              - column: { name: work_order_id, type: uuid, constraints: { nullable: false, foreignKeyName: fk_forge_events_work_order, references: work_orders(id) } }
              - column: { name: kind, type: varchar(32), constraints: { nullable: false } }
              - column: { name: author, type: varchar(255) }
              - column: { name: trusted, type: boolean, constraints: { nullable: false } }
              - column: { name: ignored_because, type: varchar(255) }
              - column: { name: body, type: text }
              - column: { name: url, type: text }
              - column: { name: received_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: consumed_at, type: timestamptz }
        - createIndex:
            tableName: forge_events
            indexName: ix_forge_events_work_order
            columns: [ { column: { name: work_order_id } }, { column: { name: received_at } } ]
  - changeSet:
      id: 007-evals
      author: digital-factory
      changes:
        - createTable:
            tableName: eval_runs
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true } }
              - column: { name: workflow, type: varchar(63), constraints: { nullable: false } }
              - column: { name: finished, type: boolean, constraints: { nullable: false } }
              - column: { name: results, type: jsonb, constraints: { nullable: false } }
              - column: { name: created_by, type: varchar(255), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: finished_at, type: timestamptz }
        - addColumn:
            tableName: work_orders
            columns:
              - column: { name: eval_run_id, type: uuid, constraints: { foreignKeyName: fk_work_orders_eval_run, references: eval_runs(id) } }
              - column: { name: judge_command, type: text }
  - changeSet:
      id: 008-budgets
      author: digital-factory
      comment: Budget reserved by each run when dispatched; the factory's pause switch and budgets (no row value = no cap)
      changes:
        - addColumn:
            tableName: runs
            columns:
              - column: { name: reserved_usd, type: "numeric(12,4)" }
        - createTable:
            tableName: factory_state
            columns:
              - column: { name: id, type: int, constraints: { primaryKey: true } }
              - column: { name: paused, type: boolean, constraints: { nullable: false } }
              - column: { name: daily_usd, type: "numeric(12,4)" }
              - column: { name: work_order_usd, type: "numeric(12,4)" }
              - column: { name: updated_by, type: varchar(255) }
              - column: { name: updated_at, type: timestamptz }
        - insert:
            tableName: factory_state
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: paused, valueBoolean: false }
  - changeSet:
      id: 009-settings
      author: digital-factory
      comment: Settings layers (merge patches over the built-in defaults), their audited changes, the settings frozen on each work order
      changes:
        - createTable:
            tableName: settings_layers
            columns:
              - column: { name: scope, type: varchar(300), constraints: { primaryKey: true } }
              - column: { name: document, type: jsonb, constraints: { nullable: false } }
              - column: { name: updated_by, type: varchar(255), constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
        - createTable:
            tableName: settings_changes
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true } }
              - column: { name: scope, type: varchar(300), constraints: { nullable: false } }
              - column: { name: before, type: jsonb, constraints: { nullable: false } }
              - column: { name: after, type: jsonb, constraints: { nullable: false } }
              - column: { name: reason, type: varchar(2000), constraints: { nullable: false } }
              - column: { name: changed_by, type: varchar(255), constraints: { nullable: false } }
              - column: { name: changed_at, type: timestamptz, constraints: { nullable: false } }
        - createIndex:
            tableName: settings_changes
            indexName: ix_settings_changes_scope
            columns: [ { column: { name: scope } }, { column: { name: changed_at } } ]
        - addColumn:
            tableName: work_orders
            columns:
              - column: { name: settings, type: jsonb, constraints: { nullable: false } }
        - addColumn:
            tableName: runs
            columns:
              - column: { name: budget_usd, type: "numeric(12,4)" }
  - changeSet:
      id: 010-agent-roles-prompts
      author: digital-factory
      comment: Agent roles (built-in ones seeded at startup), their immutable prompt versions, the output schema of each run
      changes:
        - createTable:
            tableName: agent_roles
            columns:
              - column: { name: name, type: varchar(63), constraints: { primaryKey: true } }
              - column: { name: description, type: varchar(500), constraints: { nullable: false } }
              - column: { name: writes_code, type: boolean, constraints: { nullable: false } }
              - column: { name: output_schema, type: varchar(63), constraints: { nullable: false } }
              - column: { name: built_in, type: boolean, constraints: { nullable: false } }
              - column: { name: created_by, type: varchar(255), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
        - createTable:
            tableName: prompt_versions
            columns:
              - column: { name: role, type: varchar(63), constraints: { nullable: false, foreignKeyName: fk_prompt_versions_role, references: agent_roles(name) } }
              - column: { name: version, type: int, constraints: { nullable: false } }
              - column: { name: text, type: text, constraints: { nullable: false } }
              - column: { name: note, type: varchar(200), constraints: { nullable: false } }
              - column: { name: created_by, type: varchar(255), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
        - addPrimaryKey:
            tableName: prompt_versions
            columnNames: role, version
        - addColumn:
            tableName: runs
            columns:
              - column: { name: output_schema, type: varchar(63), constraints: { nullable: false } }
  - changeSet:
      id: 011-intake
      author: digital-factory
      comment: Intake rules polled for new tickets; every ticket imported at most once (re-import is explicit), with what was reported back on it
      changes:
        - createTable:
            tableName: intake_rules
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true } }
              - column: { name: name, type: varchar(63), constraints: { nullable: false, unique: true } }
              - column: { name: source, type: varchar(32), constraints: { nullable: false } }
              - column: { name: project, type: varchar(255), constraints: { nullable: false } }
              - column: { name: filter, type: varchar(2000), constraints: { nullable: false } }
              - column: { name: repository, type: varchar(255), constraints: { nullable: false, foreignKeyName: fk_intake_rules_repository, references: repositories(key) } }
              - column: { name: workflow, type: varchar(63) }
              - column: { name: max_read, type: int, constraints: { nullable: false } }
              - column: { name: max_created, type: int, constraints: { nullable: false } }
              - column: { name: enabled, type: boolean, constraints: { nullable: false } }
              - column: { name: last_polled_at, type: timestamptz }
              - column: { name: last_error, type: text }
              - column: { name: created_by, type: varchar(255), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
        - createTable:
            tableName: imported_tickets
            columns:
              - column: { name: ticket, type: varchar(500), constraints: { primaryKey: true } }
              - column: { name: url, type: varchar(2000), constraints: { nullable: false } }
              - column: { name: work_order_id, type: uuid, constraints: { nullable: false, foreignKeyName: fk_imported_tickets_work_order, references: work_orders(id) } }
              - column: { name: rule_id, type: uuid, constraints: { foreignKeyName: fk_imported_tickets_rule, references: intake_rules(id) } }
              - column: { name: reported, type: varchar(16) }
              - column: { name: imported_at, type: timestamptz, constraints: { nullable: false } }
  - changeSet:
      id: 012-run-bundles
      author: digital-factory
      comment: The work of code-writing runs as git bundles, the next run of the work order starting from the latest succeeded one
      changes:
        - createTable:
            tableName: run_bundles
            columns:
              - column: { name: run_id, type: uuid, constraints: { primaryKey: true, foreignKeyName: fk_run_bundles_run, references: runs(id) } }
              - column: { name: bundle, type: bytea, constraints: { nullable: false } }
  - changeSet:
      id: 013-rework
      author: digital-factory
      comment: A blocked work order is reworked from a step (by default the one it stopped at), as a new engine case
      changes:
        - addColumn:
            tableName: work_orders
            columns:
              - column: { name: last_step, type: varchar(63) }
              - column: { name: reworks, type: int, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: rework_step, type: varchar(63) }
  - changeSet:
      id: 014-work-order-events
      author: digital-factory
      comment: The timeline of work orders, written by triggers on what changes (status and step, runs, approvals); the id orders the live event streams (Last-Event-ID)
      changes:
        - createTable:
            tableName: work_order_events
            columns:
              - column: { name: id, type: bigint, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: work_order_id, type: uuid, constraints: { nullable: false } }
              - column: { name: eval, type: boolean, constraints: { nullable: false } }
              - column: { name: type, type: varchar(32), constraints: { nullable: false } }
              - column: { name: data, type: jsonb, constraints: { nullable: false } }
              - column: { name: at, type: timestamptz, defaultValueComputed: now(), constraints: { nullable: false } }
              # the writing transaction: rows are streamed once every transaction before them committed
              - column: { name: tx, type: xid8, defaultValueComputed: pg_current_xact_id(), constraints: { nullable: false } }
        - createIndex:
            tableName: work_order_events
            indexName: ix_work_order_events_tx
            columns: [ { column: { name: tx } } ]
        - createIndex:
            tableName: work_order_events
            indexName: ix_work_order_events_work_order
            columns: [ { column: { name: work_order_id } }, { column: { name: id } } ]
        - sql:
            splitStatements: false
            sql: |
              create function record_work_order_event() returns trigger language plpgsql as $$
              begin
                if TG_TABLE_NAME = 'work_orders' then
                  if TG_OP = 'INSERT' or new.status is distinct from old.status or new.current_step is distinct from old.current_step
                     or new.current_visit is distinct from old.current_visit then
                    insert into work_order_events (work_order_id, eval, type, data) values (new.id, new.eval_run_id is not null,
                      'work-order', jsonb_build_object('status', new.status, 'step', new.current_step, 'visit', new.current_visit,
                                                       'reason', new.outcome_reason));
                  end if;
                elsif TG_TABLE_NAME = 'runs' then
                  if TG_OP = 'INSERT' or new.status is distinct from old.status then
                    insert into work_order_events (work_order_id, eval, type, data)
                    select new.work_order_id, w.eval_run_id is not null, 'run',
                           jsonb_build_object('run', new.id, 'step', new.step_id, 'task', new.task, 'attempt', new.attempt,
                                              'status', new.status, 'error', new.error, 'costUsd', new.cost_usd)
                    from work_orders w where w.id = new.work_order_id;
                  end if;
                elsif TG_OP = 'INSERT' or new.decision is distinct from old.decision then -- approvals
                  insert into work_order_events (work_order_id, eval, type, data)
                  select new.work_order_id, w.eval_run_id is not null, 'approval',
                         jsonb_build_object('approval', new.id, 'step', new.step_id, 'gate', new.gate, 'decision', new.decision,
                                            'by', new.decided_by, 'comment', new.comment)
                  from work_orders w where w.id = new.work_order_id;
                end if;
                return new;
              end $$;
              create trigger work_orders_events after insert or update on work_orders
                for each row execute function record_work_order_event();
              create trigger runs_events after insert or update on runs
                for each row execute function record_work_order_event();
              create trigger approvals_events after insert or update on approvals
                for each row execute function record_work_order_event();
  - changeSet:
      id: 015-pr-outcomes
      author: digital-factory
      comment: PRs merged or closed without merge, per work-order class; a class whose latest PRs fail too often loses merging
      changes:
        - createTable:
            tableName: pr_outcomes
            columns:
              - column: { name: work_order_id, type: uuid, constraints: { primaryKey: true, foreignKeyName: fk_pr_outcomes_work_order, references: work_orders(id) } }
              - column: { name: work_order_type, type: varchar(32), constraints: { nullable: false } }
              - column: { name: merged, type: boolean, constraints: { nullable: false } }
              - column: { name: at, type: timestamptz, constraints: { nullable: false } }
        - createIndex:
            tableName: pr_outcomes
            indexName: ix_pr_outcomes_type
            columns: [ { column: { name: work_order_type } }, { column: { name: at } } ]
        - addColumn:
            tableName: autonomy_policies
            columns:
              - column: { name: max_failure_rate, type: "numeric(5,4)", defaultValueNumeric: 0.25, constraints: { nullable: false } }
              - column: { name: failure_rate, type: "numeric(5,4)" }
  - changeSet:
      id: 016-pr-summaries
      author: digital-factory
      comment: The work orders that said on their open PR why the factory stopped, so that it is said once
      changes:
        - createTable:
            tableName: pr_summaries
            columns:
              - column: { name: work_order_id, type: uuid, constraints: { primaryKey: true, foreignKeyName: fk_pr_summaries_work_order, references: work_orders(id) } }
              - column: { name: at, type: timestamptz, constraints: { nullable: false } }
  - changeSet:
      id: 017-forge-event-threads
      author: digital-factory
      comment: The comment thread of a forge event (for the factory's reply) and when the factory replied
      changes:
        - addColumn:
            tableName: forge_events
            columns:
              - column: { name: thread, type: varchar(255) }
              - column: { name: replied_at, type: timestamptz }
  - changeSet:
      id: 018-worker-registry
      author: digital-factory
      comment: What workers report of themselves (version, slots, runs in progress, last heartbeat), and draining
      changes:
        - addColumn:
            tableName: workers
            columns:
              - column: { name: version, type: varchar(64) }
              - column: { name: slots, type: int }
              - column: { name: busy, type: int }
              - column: { name: last_heartbeat_at, type: timestamptz }
              - column: { name: draining, type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }
  - changeSet:
      id: 019-run-slots
      author: digital-factory
      comment: Which of a step visit's runs a run is, so that the same role several times (three reviewers) gives several verdicts
      changes:
        - addColumn:
            tableName: runs
            columns:
              - column: { name: slot, type: int, defaultValueNumeric: 0, constraints: { nullable: false } }
  - changeSet:
      id: 020-run-usage
      author: digital-factory
      comment: The model(s) and tokens an agent run used, as its worker reported them
      changes:
        - addColumn:
            tableName: runs
            columns:
              - column: { name: model, type: varchar(255) }
              - column: { name: input_tokens, type: bigint }
              - column: { name: output_tokens, type: bigint }
  - changeSet:
      id: 021-eval-suites-candidates
      author: digital-factory
      comment: Eval runs of the fast or complete suite, of the current settings or of a candidate overlay
      changes:
        - addColumn:
            tableName: eval_runs
            columns:
              - column: { name: suite, type: varchar(16), defaultValue: complete, constraints: { nullable: false } }
              - column: { name: candidate, type: jsonb }
  - changeSet:
      id: 022-forge-events-on-the-timeline
      author: digital-factory
      comment: Forge events (and the factory's replies to them) on the work-order timeline, by trigger like the rest
      changes:
        - sql:
            splitStatements: false
            sql: |
              create function record_forge_event() returns trigger language plpgsql as $$
              begin
                if TG_OP = 'INSERT' or new.replied_at is distinct from old.replied_at then
                  insert into work_order_events (work_order_id, eval, type, data)
                  select new.work_order_id, w.eval_run_id is not null, 'pr-event',
                         jsonb_build_object('event', new.id, 'kind', new.kind, 'author', new.author, 'trusted', new.trusted,
                                            'ignoredBecause', new.ignored_because, 'replied', new.replied_at is not null)
                  from work_orders w where w.id = new.work_order_id;
                end if;
                return new;
