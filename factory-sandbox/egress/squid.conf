# The only way out of the sandboxes: HTTPS to the hosts below, nothing else. Sandboxes sit on an
# internal Docker network (no route out) and get this proxy as HTTPS_PROXY / HTTP_PROXY.
http_port 3128

acl allowed dstdomain api.anthropic.com
acl allowed dstdomain repo.maven.apache.org repo1.maven.org
acl allowed dstdomain registry.npmjs.org
# more hosts (a private registry, plugin repositories): one file, one domain per line
acl allowed dstdomain "/etc/squid/allowed-extra.txt"

acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !allowed
http_access deny CONNECT !SSL_ports
http_access deny !CONNECT
http_access allow allowed

# a proxy, not a cache: nothing a sandbox fetched is served to another
cache deny all
