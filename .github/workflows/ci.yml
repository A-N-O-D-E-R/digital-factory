# Backend, worker and frontend run through the collection's reusable workflow (baseline: ADR 0001).
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # backend (mvn verify, Testcontainers) + frontend (pnpm lint/test/build) + factory image
  factory:
    uses: A-N-O-D-E-R/springboot-starter-collection/.github/workflows/reusable-ci.yml@v0.3.0
    with:
      frontend-dir: factory-frontend
      image-name: ghcr.io/a-n-o-d-e-r/digital-factory
      dockerfile: deploy/factory.Dockerfile
    permissions:
      contents: read
      packages: write

  worker:
    uses: A-N-O-D-E-R/springboot-starter-collection/.github/workflows/reusable-ci.yml@v0.3.0
    with:
      maven-dir: ''
      image-name: ghcr.io/a-n-o-d-e-r/digital-factory-worker
      dockerfile: deploy/worker.Dockerfile
    permissions:
      contents: read
      packages: write

  sandbox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factory-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: factory-sandbox/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: docker build -t factory-sandbox .
